[project]
name = "driver-license"
version = "0.1.0"
description = "台灣汽機車駕照筆試刷題 app（間隔重複，felix 內網）"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pdfplumber>=0.11",
    "pillow>=12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
