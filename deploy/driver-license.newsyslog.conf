# 日誌輪替。公網流量下 uvicorn 的存取紀錄會長得比內網快得多，而 launchd 的
# StandardOutPath 沒有任何上限 —— 沒人管的話它會安靜地把磁碟吃掉。
#
# 裝法（需要 root，newsyslog.d 是系統目錄）：
#   sudo cp deploy/driver-license.newsyslog.conf /etc/newsyslog.d/driver-license.conf
#   sudo newsyslog -nv    # 乾跑，確認它認得這幾行
#
# 欄位：logfilename [owner:group] mode count size(KB) when flags
# 旗標：C = 檔案不存在就建一個空的、J = 舊檔用 bzip2 壓、N = 輪替後不 signal 任何程序
#
# ⚠️ 已知限制，別以為裝了就沒事：macOS 的 newsyslog **沒有 copytruncate**，
# 它是 rename 舊檔再建新檔。而 launchd 是自己開好 fd 再交給程序，rename 之後
# uvicorn 手上那個 fd 仍指向舊 inode —— 新檔會是空的，日誌繼續寫進那個已被改名
# （而且即將被壓縮）的檔案，直到程序重啟為止。
# 也就是說：輪替**確實會**把磁碟空間收回來，但要讓日誌重新流進新檔，必須
#   launchctl kickstart -k gui/$(id -u)/com.driverlicense.server
# 這個取捨是刻意的：磁碟被吃爆比日誌斷幾天嚴重得多，而重啟本來就會定期發生。
